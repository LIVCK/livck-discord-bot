name: Tests

on:
  # main is tested by the image build (build.yml), which calls this before it publishes.
  push:
    branches: [develop]
  # Every pull request, whatever it targets: work lands on feature branches first, and a pull
  # request into one of those ran no tests at all.
  pull_request:
  # Called by the image build, which publishes nothing unless this passes.
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: ['22.9.0']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # One run: the coverage run IS the test run, and fails the job like it.
      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          fail_ci_if_error: false
        continue-on-error: true
