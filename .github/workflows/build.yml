name: Docker Image Build

# An image is only ever pushed from code that passed. The tests and the simulation run first, in
# this same workflow; the image job needs both. It then builds the image and runs the simulation
# against THAT image — its own entrypoint, migrations and all — and pushes only if that passes too.
#
#   main      → ghcr.io/livck/discord-bot:latest and :<commit>
#   v1.2.3    → :1.2.3, :1.2 and :<commit>
#
# Nothing else is published: no image per branch, none for a closed pull request.
#
# A pull request builds and simulates the image too, and pushes nothing: the image is tested
# before it is merged, not only after. Its tests and simulation run in their own workflows there.

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    name: Tests
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/test.yml

  simulation:
    name: Simulation
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/simulation.yml

  image:
    name: Build, simulate and push the image
    needs: [tests, simulation]
    # On a pull request the two above are skipped (they run as their own workflows there);
    # anywhere else they must have passed.
    if: >-
      !cancelled()
      && (needs.tests.result == 'success' || (github.event_name == 'pull_request' && needs.tests.result == 'skipped'))
      && (needs.simulation.result == 'success' || (github.event_name == 'pull_request' && needs.simulation.result == 'skipped'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write

    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: '1'
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd="redis-cli ping" --health-interval=5s --health-timeout=5s --health-retries=20

    env:
      CANDIDATE: livck-discord-bot:candidate

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # Only for the simulation's harness; the image installs its own.
      - name: Install dependencies
        run: npm ci

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/discord-bot
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long,prefix=

      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          load: true
          tags: ${{ env.CANDIDATE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Simulate the image
        env:
          LIVCK_SIM: '1'
          SIM_DEBUG: '1'
          SIM_BOT_IMAGE: ${{ env.CANDIDATE }}
          SIM_DB_HOST: 127.0.0.1
          SIM_DB_USER: root
          SIM_DB_PASSWORD: ''
          SIM_REDIS_HOST: 127.0.0.1
          SIM_REDIS_PORT: '6379'
          SIM_LOG_DIR: ${{ github.workspace }}/sim-logs
        # jest directly: `npm run test:sim -- <files>` would add them to the whole suite.
        run: >-
          node --experimental-vm-modules node_modules/jest/bin/jest.js --runInBand
          __tests__/sim/lifecycle.sim.test.js
          __tests__/sim/faults.sim.test.js
          __tests__/sim/membership.sim.test.js
          __tests__/sim/subscribe.sim.test.js

      - name: Log in to the GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.DOCKER_REGISTRY_TOKEN }}

      # From the cache the build above filled: the same layers that were just simulated.
      - name: Push the image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

      - name: Keep the bot logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: image-sim-logs
          path: sim-logs/
          retention-days: 14
